# Verify and test Go Mode on pushes and pull requests.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    name: Verify and test
    runs-on: ubuntu-latest
    env:
      # The Android workflow owns the full platform validation.
      ANDROID_CHECKS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            Makefile
            go.mod
            go.sum
      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
          require-lockfile: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Verify
        run: make verify
      - name: Check that verification leaves the worktree clean
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            printf '%s\n' 'Verification changed tracked files:' "$status" >&2
            exit 1
          fi
      - name: Test
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: make test
      - name: Race tests
        run: make test-race

  windows:
    name: Go packages (Windows)
    runs-on: windows-latest
    steps:
      # The runner image enables core.autocrlf; test the committed bytes instead.
      - name: Disable line ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test Go packages
        run: go test ./...
