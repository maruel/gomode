# Build the Android shell and run model-free app, gateway, Telecom tests and documentation captures.
name: Android
on:
  push:
    branches: [main]
    paths: &android_paths
      - .github/workflows/android.yml
      - Makefile
      - android/**
      - assets/**
      - e2e/**
      - pyproject.toml
      - scripts/android*
      - scripts/run-concurrently.sh
      - scripts/screenshot_publish.py
      - sdk/**
      - testdata/service-items/**
      - testdata/speech-text/**
      - testdata/voice-choices/**
      - uv.lock
  pull_request:
    paths: *android_paths
  workflow_dispatch:
permissions:
  contents: read

jobs:
  android:
    name: Build and test Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Lint and test Android
        run: make android-lint android-test
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run all model-free Android tests
        run: make android-e2e
      - name: Install capture encoders
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Render native documentation scenes on the same emulator
        run: make screenshots-generate
      - name: Upload Android results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-failure-results
          path: |
            android/gomode/build/reports/lint-results-debug.xml
            android/gomode/build/reports/detekt/
            android/gomode/build/reports/tests/
            android/gomode/build/test-results/
            android/car-dial-fixture/build/reports/
            sdk/halo/build/reports/tests/
            sdk/halo/build/test-results/
            android/gomode/build/reports/androidTests/connected/
            android/gomode/build/outputs/androidTest-results/connected/
            android/gomode/build/outputs/model-free-tests/
            /tmp/gomode_test_stock-emulator.log
            android-screenshots-failures/
          if-no-files-found: ignore
          retention-days: 7
