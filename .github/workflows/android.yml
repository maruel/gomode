# Build the Android shell and exercise it on an emulator.
name: Android
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android.yml
      - Makefile
      - android/**
      - sdk/**
      - scripts/android*
  pull_request:
    paths:
      - .github/workflows/android.yml
      - Makefile
      - android/**
      - sdk/**
      - scripts/android*
  workflow_dispatch:
permissions:
  contents: read

jobs:
  android-check:
    name: Build and check Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        run: make android-sdk
      - name: Check Android
        run: make android-check
      - name: Upload lint results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-results
          path: |
            android/gomode/build/reports/lint-results-debug.xml
            android/gomode/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7

  android-e2e:
    name: Test Android shell on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android E2E tests
        run: make android-e2e
      - name: Upload emulator test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-failure-results
          path: |
            android/gomode/build/reports/androidTests/connected/
            android/gomode/build/outputs/androidTest-results/connected/
            /tmp/gomode_test-emulator.log
          if-no-files-found: ignore
          retention-days: 7
